name: Setup Vite+ Safe
description: Install Vite+ from the committed lockfile and guarantee a working vp CLI on PATH.

inputs:
  node-version-file:
    description: Path to the Node version file.
    required: false
  cache:
    description: Whether to enable setup-vp caching.
    required: false
    default: "true"
  run-install:
    description: Whether the action should install workspace dependencies from the committed lockfile.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js with npm cache
      if: ${{ inputs.cache == 'true' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Setup Node.js without cache
      if: ${{ inputs.cache != 'true' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: ${{ inputs.node-version-file }}

    - name: Install workspace dependencies from lockfile
      if: ${{ inputs.run-install == 'true' }}
      shell: pwsh
      run: npm ci

    - name: Expose workspace npm binaries
      shell: pwsh
      run: |
        $workspaceBin = Join-Path $PWD "node_modules/.bin"
        if (Test-Path -LiteralPath $workspaceBin) {
          if ($IsWindows) {
            $env:PATH = "$workspaceBin;$env:PATH"
          } else {
            $env:PATH = "${workspaceBin}:$env:PATH"
          }

          if ($env:GITHUB_PATH) {
            $workspaceBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
        }

    - name: Ensure Vite+ CLI
      shell: pwsh
      run: ./scripts/ci/ensure-vp.ps1

    - name: Install Vite+ managed tools
      if: ${{ inputs.run-install == 'true' }}
      shell: pwsh
      run: vp install
