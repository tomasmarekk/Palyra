name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: ${{ matrix.check }} (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS use isolated lanes to avoid deleting and recompiling one
        # target tree; Windows stays combined to reuse build artifacts without duplication.
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            check: Workspace / Build
            mode: build
          - os: macos-latest
            runner: macos-latest
            check: Workspace / Build
            mode: build
          - os: ubuntu-latest
            runner: ubuntu-latest
            check: Workspace / Test
            mode: test
          - os: macos-latest
            runner: macos-latest
            check: Workspace / Test
            mode: test
          - os: windows-latest
            runner: windows-2025-vs2026
            check: Workspace / Build and test
            mode: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Setup Vite+
        uses: ./.github/actions/setup-vp-safe
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Build desktop UI
        shell: pwsh
        run: ./scripts/test/ensure-desktop-ui.ps1

      - name: Cargo build
        if: matrix.mode != 'test'
        run: cargo build --workspace --locked

      - name: Build QA daemon runtime for integration tests
        if: matrix.mode == 'test'
        run: cargo build -p palyra-daemon --bin palyrad --locked

      - name: Cargo test
        if: matrix.mode != 'build'
        run: cargo test --workspace --locked

      - name: Unix process supervisor topology and protocol regressions
        if: ${{ matrix.mode == 'test' && (runner.os == 'Linux' || runner.os == 'macOS') }}
        run: bash scripts/test/run-unix-process-supervisor-regressions.sh

  desktop-linux-release-regression:
    name: Desktop / Release regression (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Setup Vite+
        uses: ./.github/actions/setup-vp-safe
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Install desktop Linux system dependencies
        uses: ./.github/actions/setup-desktop-linux

      - name: Build desktop UI
        shell: pwsh
        run: ./scripts/test/ensure-desktop-ui.ps1

      - name: Cargo test (desktop, release)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked

  deterministic-core:
    name: QA / Deterministic core (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Setup Vite+
        uses: ./.github/actions/setup-vp-safe
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Install desktop Linux system dependencies
        uses: ./.github/actions/setup-desktop-linux

      - name: Run deterministic core suite
        run: bash scripts/test/run-deterministic-core.sh

  deterministic-fault-smoke:
    name: QA / Deterministic fault smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Run deterministic fault smoke (Unix)
        if: ${{ runner.os != 'Windows' }}
        run: bash scripts/test/run-deterministic-fault-smoke.sh

      - name: Run deterministic fault smoke (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/test/run-deterministic-fault-smoke.ps1

      - name: Upload deterministic fault reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deterministic-fault-smoke-${{ runner.os }}
          path: |
            artifacts/qa-lab/deterministic-fault-smoke/**
            target/release-artifacts/continuity-campaign/**
          if-no-files-found: error

  runtime-contract-snapshots:
    name: Runtime / Contract snapshots (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Validate journal migration fixture
        run: bash scripts/test/check-journal-migration-fixture.sh

      - name: Run runtime contract snapshot gates
        run: bash scripts/test/check-runtime-contract-snapshots.sh

  critical-attack-scenarios:
    name: Security / Critical attack scenarios (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Run critical attack scenarios
        run: bash scripts/test/run-critical-attack-scenarios.sh

  workflow-regression:
    name: QA / Workflow regression (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      PALYRA_WORKFLOW_REGRESSION_PROFILE: fast
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Run workflow regression matrix
        run: bash scripts/test/run-workflow-regression.sh

      - name: Upload workflow regression artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workflow-regression-fast
          path: target/release-artifacts/workflow-regression
          if-no-files-found: error

  performance-smoke:
    name: Performance / Smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Setup Vite+
        uses: ./.github/actions/setup-vp-safe
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Install desktop Linux system dependencies
        uses: ./.github/actions/setup-desktop-linux

      - name: Run performance smoke suite
        run: bash scripts/test/run-performance-smoke.sh

  quality:
    name: Quality / Static checks (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2

      - name: Enforce pinned GitHub Actions
        run: bash scripts/check-gh-actions-pinned.sh

      - name: Guard vendored artifacts
        run: bash scripts/check-no-vendored-artifacts.sh

      - name: Guard runtime artifacts
        run: bash scripts/check-runtime-artifacts.sh

      - name: Guard local-only tracked paths
        run: bash scripts/check-local-only-tracked-files.sh

      - name: Changed-scope planner self-test
        run: bash scripts/ci/plan-changed-scope.sh --self-test

      - name: Module budget and connector boundary checks
        run: bash scripts/dev/report-module-budgets.sh --strict

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Setup Vite+
        uses: ./.github/actions/setup-vp-safe
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: JS and rollout contract check
        run: npm run js:check

      - name: Rustfmt check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  cli-parity:
    name: CLI / Parity acceptance (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Generate CLI parity report
        run: cargo run -p palyra-cli --example render_cli_parity_report --locked -- crates/palyra-cli/tests/cli_parity_matrix.toml artifacts/cli-parity-acceptance-matrix.md

      - name: Validate CLI parity acceptance
        run: cargo test -p palyra-cli --test cli_parity --test help_snapshots --locked

      - name: Upload CLI parity artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-parity-acceptance-matrix
          path: artifacts/cli-parity-acceptance-matrix.md

  qa-lab:
    name: QA / Runtime smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Build QA daemon runtime
        run: cargo build -p palyra-daemon --bin palyrad --locked

      - name: Preview preserved legacy P0 coverage
        run: |
          cargo run -p palyra-cli --locked -- qa run-pack --path qa/scenarios --tag p0 --output artifacts/qa-lab/release-schema-preview-core.json
          cargo run -p palyra-cli --locked -- qa run-pack --path qa/scenarios/execution_backends --tag p0 --output artifacts/qa-lab/release-schema-preview-backends.json
          cargo run -p palyra-cli --locked -- qa run-pack --path qa/scenarios/provider --tag p0 --output artifacts/qa-lab/release-schema-preview-provider.json
          cargo run -p palyra-cli --locked -- qa run-pack --path qa/scenarios/mcp --tag p0 --output artifacts/qa-lab/release-schema-preview-mcp.json

      - name: Run QA Lab PR smoke gate
        run: cargo run -p palyra-cli --locked -- qa gate --suite qa/suites/pr_smoke.yaml --output-json artifacts/qa-lab/pr-smoke.json --output-markdown artifacts/qa-lab/pr-smoke.md --json

      - name: Run replay baseline gate
        env:
          PALYRA_QA_PALYRAD_BIN: ${{ github.workspace }}/target/debug/palyrad
        run: |
          test -f "$PALYRA_QA_PALYRAD_BIN" && test ! -L "$PALYRA_QA_PALYRAD_BIN"
          mkdir -p artifacts/qa-lab/baseline-replay
          cargo run -p palyra-cli --locked -- qa gate --suite qa/suites/baseline_replay.yaml --output-json artifacts/qa-lab/baseline-replay/baseline-replay.json --output-markdown artifacts/qa-lab/baseline-replay/baseline-replay.md --json

      - name: Run RuntimeKernelV2 shadow gate
        env:
          PALYRA_QA_PALYRAD_BIN: ${{ github.workspace }}/target/debug/palyrad
        run: |
          test -f "$PALYRA_QA_PALYRAD_BIN" && test ! -L "$PALYRA_QA_PALYRAD_BIN"
          mkdir -p artifacts/qa-lab/runtime-kernel-v2-shadow
          cargo run -p palyra-cli --locked -- qa gate --suite qa/suites/runtime_kernel_v2_shadow.yaml --output-json artifacts/qa-lab/runtime-kernel-v2-shadow/report.json --output-markdown artifacts/qa-lab/runtime-kernel-v2-shadow/report.md --json

      - name: Run authoritative RuntimeKernelV2 gate
        env:
          PALYRA_QA_PALYRAD_BIN: ${{ github.workspace }}/target/debug/palyrad
        run: |
          test -f "$PALYRA_QA_PALYRAD_BIN" && test ! -L "$PALYRA_QA_PALYRAD_BIN"
          mkdir -p artifacts/qa-lab/runtime-kernel-v2-authoritative
          cargo run -p palyra-cli --locked -- qa gate --suite qa/suites/runtime_kernel_v2_authoritative.yaml --output-json artifacts/qa-lab/runtime-kernel-v2-authoritative/report.json --output-markdown artifacts/qa-lab/runtime-kernel-v2-authoritative/report.md --json

      - name: Upload QA Lab reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qa-lab-pr-smoke
          path: artifacts/qa-lab
          if-no-files-found: error

  protocol-contracts:
    name: Protocol / Rust and Kotlin (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Install protocol tooling
        run: |
          missing_packages=()
          if ! command -v protoc >/dev/null 2>&1; then
            missing_packages+=(protobuf-compiler)
          fi
          if ! command -v javac >/dev/null 2>&1; then
            missing_packages+=(default-jdk)
          fi
          if ! command -v kotlinc >/dev/null 2>&1; then
            missing_packages+=(kotlin)
          fi
          if [ "${#missing_packages[@]}" -eq 0 ]; then
            echo "Protocol tooling already available on runner."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y "${missing_packages[@]}"

      - name: Validate protobuf schemas
        run: bash scripts/protocol/validate-proto.sh

      - name: Generate protocol stubs
        run: bash scripts/protocol/generate-stubs.sh

      - name: Validate Rust stubs
        run: bash scripts/protocol/validate-rust-stubs.sh

      - name: Validate Kotlin stubs
        run: bash scripts/protocol/validate-kotlin-stubs.sh

      - name: Verify generated stubs are up to date
        run: bash scripts/protocol/check-generated-stubs.sh

  protocol-swift:
    name: Protocol / Swift (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Validate protobuf schemas
        run: bash scripts/protocol/validate-proto.sh

      - name: Generate protocol stubs
        run: bash scripts/protocol/generate-stubs.sh

      - name: Validate Swift stubs
        run: bash scripts/protocol/validate-swift-stubs.sh

      - name: Verify generated stubs are up to date
        run: bash scripts/protocol/check-generated-stubs.sh

  protocol-windows:
    name: Protocol / Windows (windows-latest)
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Install protobuf compiler
        run: ./scripts/protocol/install-protoc-windows.ps1

      - name: Validate protobuf schemas
        run: ./scripts/protocol/validate-proto.ps1

      - name: Generate protocol stubs
        run: ./scripts/protocol/generate-stubs.ps1

      - name: Validate Rust stubs
        run: ./scripts/protocol/validate-rust-stubs.ps1

      - name: Verify generated stubs are up to date
        run: ./scripts/protocol/check-generated-stubs.ps1

  web-cleanroom:
    name: Web / Clean install (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Vite+
        uses: ./.github/actions/setup-vp-safe
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Run clean-room web validation
        run: vp run web:ci

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
    secrets: inherit
