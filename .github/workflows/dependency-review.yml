name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependencies / Review (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check dependency graph availability
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.dependency_graph.status // "unknown"')
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "Dependency graph status: ${status}"

      - name: Dependency review
        if: steps.dependency-graph.outputs.status == 'enabled'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

      - name: Dependency review skipped
        if: steps.dependency-graph.outputs.status != 'enabled'
        run: |
          echo "Dependency review skipped because dependency graph is not enabled for this repository."
