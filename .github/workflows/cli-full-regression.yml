name: CLI full regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workflow-regression:
    name: CLI / Workflow regression (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      PALYRA_WORKFLOW_REGRESSION_PROFILE: full
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Validate journal migration fixture
        run: bash scripts/test/check-journal-migration-fixture.sh

      - name: Run workflow regression matrix
        run: bash scripts/test/run-workflow-regression.sh

      - name: Run replay gate
        run: bash scripts/test/run-replay-gate.sh

      - name: Run deployment smoke
        run: bash scripts/test/run-deployment-smoke.sh

      - name: Upload workflow regression artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workflow-regression-full
          path: target/release-artifacts/workflow-regression
          if-no-files-found: error

  release-smoke:
    name: Release / Packaging smoke (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          toolchain: 1.95.0

      - name: Setup Vite+
        uses: ./.github/actions/setup-vp-safe
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Install desktop Linux system dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: ./.github/actions/setup-desktop-linux

      - name: Run release packaging smoke
        shell: pwsh
        run: ./scripts/test/run-release-smoke.ps1

      - name: Upload release smoke artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-smoke-${{ matrix.os }}
          path: target/release-artifacts/smoke
          if-no-files-found: error
