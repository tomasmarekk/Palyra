# Credential-free provider turn for the deterministic crash-after-effect QA scenario.
schema_version: 1
id: qa.mock.provider.fault-injection-runner
turns:
  - id: mutation_before_ack_crash
    match:
      prompt_contains:
        - apply the deterministic fault injection mutation
    behavior:
      kind: approval_required
      tool_calls:
        - proposal_id: qa-fault-mutation
          tool_name: palyra.fs.apply_patch
          input_json:
            patch: "*** Begin Patch\n*** Update File: src/app.txt\n@@\n-initial sandbox content\n+fault effect happened once\n*** End Patch\n"
      prompt_tokens: 8
      completion_tokens: 10
