schema_version: 1
id: provider.compat.unsupported_schema
title: Provider compatibility unsupported schema
area: provider
mode:
  provider: mock
  deterministic: true
requires:
  model: text
  capabilities:
    - qa_lab
    - provider_compat
  tools: []
  fixtures:
    - fixtures/provider_compat/p0_provider_compat_pack.yaml
steps:
  - id: prompt
    action: user_prompt
    prompt: "Classify the unsupported_schema provider compatibility fixture."
expect:
  terminal_state: failed
  final_answer:
    contains:
      - "unsupported_schema"
      - "fail_closed"
  events:
    - event_type: provider.compat.fixture.loaded
      min_count: 1
    - event_type: provider.recovery.decision
      min_count: 1
  tool_calls: []
forbidden:
  tool_calls: []
  events:
    - schema.downgrade.unverified
  artifacts: []
  claims: []
artifacts:
  - path: qa/reports/provider/unsupported_schema.json
    kind: report
    required: true
maturity:
  labels:
    - p0
    - nightly
    - provider_compat
timeout:
  run_ms: 30000
  step_ms: 10000
