# Exercises provider context overflow through the authoritative runtime and the
# real bounded ContextRecoveryController ladder.
schema_version: 5
id: provider.compat.context_overflow
title: Provider context overflow recovery through the real runtime
area: provider
mode:
  runner: fixture
  deterministic: true
runner:
  provider_fixture: qa/fixtures/runtime_kernel_v2_authoritative.yaml
  workspace_fixture: qa/fixtures/sandbox_workspaces/repo_basic
  policy_profile: runtime_kernel_v2_authoritative_compaction
requires:
  model: text
  capabilities:
    - agent_run
    - context_compaction
    - provider_recovery
    - qa_lab
    - runtime_kernel_v2_authoritative
  tools: []
  fixtures:
    - qa/fixtures/runtime_kernel_v2_authoritative.yaml
    - qa/fixtures/sandbox_workspaces/repo_basic
steps:
  - id: prompt
    action: user_prompt
    prompt: "Recover the provider context_overflow fixture through compact_and_retry."
expect:
  terminal_state: completed
  final_answer:
    equals: "context_window_exceeded recovered through compact_and_retry."
  events:
    - event_type: runtime.authority.selected
      min_count: 1
    - event_type: provider.lane.attested
      min_count: 1
    - event_type: recovery.action.started
      min_count: 1
    - event_type: context.recovery.plan
      min_count: 1
    - event_type: runtime.compaction.required
      min_count: 1
    - event_type: runtime.compaction.applied
      min_count: 1
    - event_type: recovery.action.completed
      min_count: 1
    - event_type: run.completed
      min_count: 1
  tool_calls: []
  runtime_path:
    runtime_contract_version: runtime-contracts.v15
    provider_lane: fixture
    attempt_owner: runtime_kernel_v2.embedded
    harness_id: runtime_kernel_v2.embedded
    context_engine_id: runtime_kernel_v2.preassembled_context
    max_fallback_count: 0
    allowed_fallback_reason_codes: []
forbidden:
  tool_calls:
    - "*"
  events:
    - run.failed
    - secret.exposed
  artifacts: []
  claims: []
artifacts:
  - path: qa/reports/provider/context_overflow.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - release_smoke
    - real_runtime
    - nightly
    - deterministic
    - provider_recovery
    - context_compaction
    - runtime_kernel_v2_authoritative
timeout:
  run_ms: 60000
  step_ms: 10000
