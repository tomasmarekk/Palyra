schema_version: 1
id: mcp.transport_reconnect
title: MCP transport reconnect
area: workflow
mode:
  provider: mock
  deterministic: true
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - mcp
  tools:
    - mcp.artifacts.read_large
  fixtures:
    - qa/fixtures/mcp/http_server.json
steps:
  - id: prompt
    action: user_prompt
    prompt: "Reconnect the HTTP MCP transport and keep the imported tool available."
expect:
  terminal_state: completed
  final_answer:
    contains:
      - "mcp transport reconnected"
  events:
    - event_type: mcp.transport.disconnected
      min_count: 1
    - event_type: mcp.transport.reconnected
      min_count: 1
    - event_type: mcp.discovery.snapshot
      min_count: 1
    - event_type: tool.call.completed
      min_count: 1
    - event_type: run.completed
      min_count: 1
  tool_calls:
    - name: mcp.artifacts.read_large
      min_count: 1
forbidden:
  tool_calls: []
  events:
    - mcp.transport_reconnect_failed
  artifacts: []
  claims:
    - "server unavailable"
artifacts:
  - path: qa/reports/mcp_transport_reconnect.json
    kind: report
    required: true
  - path: qa/reports/mcp_transport_reconnect.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - release_smoke
    - mcp
timeout:
  run_ms: 30000
  step_ms: 10000
