schema_version: 1
id: mcp.server_import_read_tool
title: MCP server import read tool
area: tools
mode:
  provider: mock
  deterministic: true
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - mcp
  tools:
    - mcp.docs.search
  fixtures:
    - qa/fixtures/mcp/stdio_server.json
steps:
  - id: prompt
    action: user_prompt
    prompt: "Import the docs MCP server and call the read-only search tool."
expect:
  terminal_state: completed
  final_answer:
    contains:
      - "mcp read tool imported"
  events:
    - event_type: mcp.discovery.snapshot
      min_count: 1
    - event_type: mcp.tool_import.snapshot
      min_count: 1
    - event_type: tool.call.completed
      min_count: 1
    - event_type: run.completed
      min_count: 1
  tool_calls:
    - name: mcp.docs.search
      min_count: 1
forbidden:
  tool_calls: []
  events:
    - mcp.server_unavailable
    - mcp.runtime_regression
  artifacts: []
  claims:
    - "credential-placeholder"
artifacts:
  - path: qa/reports/mcp_server_import_read_tool.json
    kind: report
    required: true
  - path: qa/reports/mcp_server_import_read_tool.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - release_smoke
    - mcp
timeout:
  run_ms: 30000
  step_ms: 10000
