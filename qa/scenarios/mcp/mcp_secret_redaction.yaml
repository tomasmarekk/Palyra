schema_version: 1
id: mcp.secret_redaction
title: MCP secret redaction
area: security
mode:
  provider: mock
  deterministic: true
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - mcp
    - redaction
  tools:
    - mcp.docs.search
  fixtures:
    - qa/fixtures/mcp/stdio_server.json
steps:
  - id: prompt
    action: user_prompt
    prompt: "Call the MCP server and verify output and errors are redacted."
expect:
  terminal_state: completed
  final_answer:
    contains:
      - "mcp secret redaction verified"
  events:
    - event_type: mcp.tool_import.snapshot
      min_count: 1
    - event_type: redaction.applied
      min_count: 1
    - event_type: tool.call.completed
      min_count: 1
    - event_type: run.completed
      min_count: 1
  tool_calls:
    - name: mcp.docs.search
      min_count: 1
forbidden:
  tool_calls: []
  events:
    - secret.exposed
  artifacts: []
  claims:
    - "mcp-secret-token"
artifacts:
  - path: qa/reports/mcp_secret_redaction.json
    kind: report
    required: true
  - path: qa/reports/mcp_secret_redaction.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - release_smoke
    - mcp
    - security
timeout:
  run_ms: 30000
  step_ms: 10000
