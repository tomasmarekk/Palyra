# Proves that an uncertain process mutation is fenced as outcome-unknown, never blindly replayed.
schema_version: 4
id: fault_injection.process_effect_before_ack
title: Process mutation crash after effect and before acknowledgement
area: tools
mode:
  runner: fixture
  deterministic: true
runner:
  provider_fixture: qa/fixtures/fault_injection_runner.yaml
  workspace_fixture: qa/fixtures/sandbox_workspaces/repo_basic
  policy_profile: qa_fault_mutation
fault_injection:
  schema_version: 1
  format: palyra-qa-fault-injection-plan
  seed: 20260711
  activations:
    - id: process-effect-before-ack
      point_id: tool.after_effect_before_ack
      actor: qa-fault-process
      occurrence: 1
      action:
        type: terminate_process
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - approvals
    - workspace_context
    - fault_injection
  tools:
    - palyra.process.run
  fixtures:
    - qa/fixtures/fault_injection_runner.yaml
    - qa/fixtures/sandbox_workspaces/repo_basic
steps:
  - id: prompt
    action: user_prompt
    prompt: "Run the deterministic process reconciliation fault."
  - id: approve_process
    action: approval_decision
    proposal_id: qa-fault-process
    decision: allow
expect:
  terminal_state: failed
  tool_calls:
    - name: palyra.process.run
      min_count: 1
      max_count: 1
  fault_injection:
    activations:
      - activation_id: process-effect-before-ack
        recovery_class: outcome_unknown
    daemon_restarts: 1
forbidden:
  tool_calls: []
  events: []
  artifacts: []
  claims: []
artifacts:
  - path: qa/reports/fault_injection/process_effect_before_ack.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - deterministic
    - fault_injection
    - crash_recovery
    - process
timeout:
  run_ms: 45000
  step_ms: 15000
