# Proves that a post-effect crash is observable and never triggers a blind tool replay.
schema_version: 4
id: fault_injection.tool_effect_before_ack
title: Mutating tool crash after effect and before acknowledgement
area: tools
mode:
  runner: fixture
  deterministic: true
runner:
  provider_fixture: qa/fixtures/fault_injection_runner.yaml
  workspace_fixture: qa/fixtures/sandbox_workspaces/repo_basic
  policy_profile: qa_fault_mutation
fault_injection:
  schema_version: 1
  format: palyra-qa-fault-injection-plan
  seed: 20260710
  activations:
    - id: tool-effect-before-ack
      point_id: tool.after_effect_before_ack
      occurrence: 1
      action:
        type: terminate_process
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - approvals
    - workspace_context
    - fault_injection
  tools:
    - palyra.fs.apply_patch
  fixtures:
    - qa/fixtures/fault_injection_runner.yaml
    - qa/fixtures/sandbox_workspaces/repo_basic
steps:
  - id: prompt
    action: user_prompt
    prompt: "Apply the deterministic fault injection mutation."
  - id: approve_mutation
    action: approval_decision
    proposal_id: qa-fault-mutation
    decision: allow
expect:
  terminal_state: failed
  tool_calls:
    - name: palyra.fs.apply_patch
      min_count: 1
      max_count: 1
  fault_injection:
    activations:
      - activation_id: tool-effect-before-ack
        recovery_class: outcome_unknown
    daemon_restarts: 1
forbidden:
  tool_calls: []
  events: []
  artifacts: []
  claims: []
artifacts:
  - path: qa/fixtures/app.txt
    kind: workspace
    required: true
    sha256: 78930e608b8acfc1799a5e09e2f1bdb408dde4fd2607d38b86acb16130c2c550
  - path: qa/reports/fault_injection/tool_effect_before_ack.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - deterministic
    - fault_injection
    - crash_recovery
timeout:
  run_ms: 45000
  step_ms: 15000
