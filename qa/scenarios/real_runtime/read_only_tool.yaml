# Exercises a real read-only tool call against an isolated copied workspace.
# The fixture contains no credentials and is removed with the scenario daemon.
schema_version: 5
id: real_runtime.read_only_tool
title: Read-only tool through the real runtime
area: tools
mode:
  runner: fixture
  deterministic: true
runner:
  provider_fixture: qa/fixtures/real_agent_runner.yaml
  workspace_fixture: qa/fixtures/sandbox_workspaces/repo_basic
  policy_profile: qa_read_only
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - workspace_context
  tools:
    - palyra.fs.read_file
  fixtures:
    - qa/fixtures/real_agent_runner.yaml
    - qa/fixtures/sandbox_workspaces/repo_basic
steps:
  - id: prompt
    action: user_prompt
    prompt: "Inspect the QA workspace fixture with the read-only tool."
expect:
  terminal_state: completed
  final_answer:
    equals: "The workspace fixture contains initial sandbox content."
  events:
    - event_type: tool.call.started
      min_count: 1
    - event_type: tool.call.completed
      min_count: 1
    - event_type: run.completed
      min_count: 1
  tool_calls:
    - name: palyra.fs.read_file
      min_count: 1
  runtime_path:
    runtime_contract_version: runtime-contracts.v16
    provider_lane: fixture
    attempt_owner: embedded_run_stream
    harness_id: embedded_run_stream
    context_engine_id: legacy_provider_input
    max_fallback_count: 0
    allowed_fallback_reason_codes: []
forbidden:
  tool_calls:
    - palyra.fs.apply_patch
  events:
    - approval.required
    - run.failed
    - secret.exposed
  artifacts: []
  claims:
    - mutation performed
artifacts:
  - path: qa/reports/real_runtime/read_only_tool.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - release_smoke
    - real_runtime
    - nightly
    - deterministic
    - read_only
    - baseline_replay
timeout:
  run_ms: 45000
  step_ms: 15000
