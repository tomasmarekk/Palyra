# Replays a pre-redacted provider capture through the production daemon path.
schema_version: 5
id: real_runtime.record_replay_text
title: Redacted provider replay through the real runtime
area: replay
mode:
  runner: record_replay
  deterministic: true
runner:
  replay_fixture: qa/fixtures/record_replay/real_agent_runner_replay.yaml
  fixture_redacted: true
  raw_payload_storage: false
  workspace_fixture: qa/fixtures/sandbox_workspaces/repo_basic
  policy_profile: qa_no_tools
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - record_replay
  tools: []
  fixtures:
    - qa/fixtures/record_replay/real_agent_runner_replay.yaml
    - qa/fixtures/sandbox_workspaces/repo_basic
steps:
  - id: prompt
    action: user_prompt
    prompt: "Return the exact deterministic QA response."
expect:
  terminal_state: completed
  final_answer:
    equals: "The deterministic QA response is exact."
  events:
    - event_type: run.started
      min_count: 1
    - event_type: model.delta
      min_count: 1
    - event_type: run.completed
      min_count: 1
  tool_calls: []
  runtime_path:
    runtime_contract_version: runtime-contracts.v7
    provider_lane: record_replay
    attempt_owner: embedded_run_stream
    harness_id: embedded_run_stream
    context_engine_id: legacy_provider_input
    max_fallback_count: 0
    allowed_fallback_reason_codes: []
forbidden:
  tool_calls:
    - "*"
  events:
    - run.failed
    - secret.exposed
  artifacts: []
  claims: []
artifacts:
  - path: qa/reports/real_runtime/record_replay_text.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - real_runtime
    - nightly
    - deterministic
    - record_replay
    - baseline_replay
timeout:
  run_ms: 30000
  step_ms: 10000
