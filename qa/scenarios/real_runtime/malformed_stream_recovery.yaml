# Runs a retryable malformed provider stream through the normal agent endpoint.
# Recovery is deterministic and credential-free but still uses real runtime evidence.
schema_version: 5
id: real_runtime.malformed_stream_recovery
title: Malformed provider stream recovery through the real runtime
area: provider
mode:
  runner: fixture
  deterministic: true
runner:
  provider_fixture: qa/fixtures/provider_retry_recovery.yaml
  workspace_fixture: qa/fixtures/sandbox_workspaces/repo_basic
  policy_profile: qa_provider_recovery
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - provider_recovery
  tools: []
  fixtures:
    - qa/fixtures/provider_retry_recovery.yaml
    - qa/fixtures/sandbox_workspaces/repo_basic
steps:
  - id: prompt
    action: user_prompt
    prompt: "Recover a streamed answer."
expect:
  terminal_state: completed
  final_answer:
    equals: "Recovered after a retryable malformed response."
  events:
    - event_type: run.started
      min_count: 1
    - event_type: provider.retry.started
      min_count: 1
    - event_type: model_token
      min_count: 1
    - event_type: model.delta
      min_count: 1
    - event_type: run.completed
      min_count: 1
  tool_calls: []
  runtime_path:
    runtime_contract_version: runtime-contracts.v16
    provider_lane: fixture
    attempt_owner: embedded_run_stream
    harness_id: embedded_run_stream
    context_engine_id: legacy_provider_input
    max_fallback_count: 0
    allowed_fallback_reason_codes: []
forbidden:
  tool_calls:
    - "*"
  events:
    - run.failed
    - secret.exposed
  artifacts: []
  claims: []
artifacts:
  - path: qa/reports/real_runtime/malformed_stream_recovery.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - release_smoke
    - real_runtime
    - nightly
    - deterministic
    - provider_recovery
    - baseline_replay
timeout:
  # Shared Windows CI may schedule this retry path alongside other real-runtime test binaries.
  run_ms: 60000
  step_ms: 30000
