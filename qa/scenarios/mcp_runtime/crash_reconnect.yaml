# Proves that a crashed stdio server is replaced by one new actor-owned generation.
schema_version: 5
id: mcp_runtime.crash_reconnect
title: Persistent MCP stdio crash and reconnect
area: tools
mode:
  runner: fixture
  deterministic: true
runner:
  provider_fixture: qa/fixtures/mcp/persistent_reconnect_provider.yaml
  workspace_fixture: qa/fixtures/sandbox_workspaces/mcp_persistent
  policy_profile: qa_mcp_persistent
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - mcp
    - workspace_context
  tools:
    - mcp.conformance.inspect
  fixtures:
    - qa/fixtures/mcp/persistent_reconnect_provider.yaml
    - qa/fixtures/sandbox_workspaces/mcp_persistent
steps:
  - id: prompt
    action: user_prompt
    prompt: "Crash and reconnect the persistent MCP server."
  - id: approve_crashing_call
    action: approval_decision
    proposal_id: qa-mcp-reconnect-first
    decision: allow
  - id: approve_reconnected_call
    action: approval_decision
    proposal_id: qa-mcp-reconnect-second
    decision: allow
expect:
  terminal_state: completed
  final_answer:
    equals: "MCP crash reconnect verified."
  events:
    - event_type: tool.call.started
      min_count: 2
    - event_type: tool.call.completed
      min_count: 2
    - event_type: run.completed
      min_count: 1
  tool_calls:
    - name: mcp.conformance.inspect
      min_count: 1
      success: false
    - name: mcp.conformance.inspect
      min_count: 1
      success: true
  runtime_path:
    runtime_contract_version: runtime-contracts.v16
    provider_lane: fixture
    attempt_owner: embedded_run_stream
    harness_id: embedded_run_stream
    context_engine_id: legacy_provider_input
    mcp_transport_mode: persistent
    max_fallback_count: 0
    allowed_fallback_reason_codes: []
forbidden:
  tool_calls: []
  events:
    - run.failed
    - secret.exposed
  artifacts: []
  claims:
    - per-call MCP process launch
artifacts:
  - path: qa/reports/mcp_runtime/crash_reconnect.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - release_smoke
    - promotion_gate
    - mcp
    - mcp_persistent
    - deterministic
timeout:
  run_ms: 60000
  step_ms: 20000
