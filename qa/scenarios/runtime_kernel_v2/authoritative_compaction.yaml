# Forces the authoritative V2 compaction phase through a context-overflow fixture.
schema_version: 5
id: runtime_kernel_v2.authoritative_compaction
title: Authoritative RuntimeKernelV2 compaction boundary
area: workflow
mode:
  runner: fixture
  deterministic: true
runner:
  provider_fixture: qa/fixtures/runtime_kernel_v2_authoritative.yaml
  workspace_fixture: qa/fixtures/sandbox_workspaces/repo_basic
  policy_profile: runtime_kernel_v2_authoritative_compaction
requires:
  model: text
  capabilities:
    - agent_run
    - context_compaction
    - qa_lab
    - runtime_kernel_v2_authoritative
  tools: []
  fixtures:
    - qa/fixtures/runtime_kernel_v2_authoritative.yaml
    - qa/fixtures/sandbox_workspaces/repo_basic
steps:
  - id: prompt
    action: user_prompt
    prompt: "Exercise the authoritative V2 compaction boundary."
expect:
  terminal_state: completed
  final_answer:
    equals: "RuntimeKernelV2 compacted context and completed the retry."
  events:
    - event_type: runtime.authority.selected
      min_count: 1
    - event_type: status
      min_count: 1
    - event_type: provider.lane.attested
      min_count: 1
    - event_type: runtime.compaction.required
      min_count: 1
    - event_type: runtime.compaction.applied
      min_count: 1
    - event_type: model.delta
      min_count: 1
    - event_type: message.replied
      min_count: 1
    - event_type: run.completed
      min_count: 1
  tool_calls: []
  runtime_path:
    runtime_contract_version: runtime-contracts.v16
    provider_lane: fixture
    attempt_owner: runtime_kernel_v2.embedded
    harness_id: runtime_kernel_v2.embedded
    context_engine_id: runtime_kernel_v2.preassembled_context
    max_fallback_count: 0
    allowed_fallback_reason_codes: []
forbidden:
  tool_calls:
    - "*"
  events:
    - run.failed
    - runtime.shadow.differential
    - secret.exposed
  artifacts: []
  claims: []
artifacts:
  - path: qa/reports/runtime_kernel_v2/authoritative_compaction.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - deterministic
    - real_runtime
    - runtime_kernel_v2_authoritative
    - promotion_gate
    - context_compaction
timeout:
  run_ms: 60000
  step_ms: 10000
