# Promotion evidence for the production shadow observer. The runtime must bind
# the policy profile to explicit enrollment before this gate can turn green.
schema_version: 5
id: runtime_kernel_v2.shadow_differential
title: Legacy-authoritative RuntimeKernelV2 shadow differential
area: security
mode:
  runner: fixture
  deterministic: true
runner:
  provider_fixture: qa/fixtures/runtime_kernel_v2_shadow.yaml
  workspace_fixture: qa/fixtures/sandbox_workspaces/repo_basic
  policy_profile: runtime_kernel_v2_shadow_explicit
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - runtime_kernel_v2_shadow
  tools: []
  fixtures:
    - qa/fixtures/runtime_kernel_v2_shadow.yaml
    - qa/fixtures/sandbox_workspaces/repo_basic
steps:
  - id: prompt
    action: user_prompt
    prompt: "Compare the legacy and V2 shadow plans, then return the fixture response."
expect:
  terminal_state: completed
  final_answer:
    equals: "The authoritative legacy run completed while V2 stayed observe-only."
  events:
    - event_type: run.started
      min_count: 1
    - event_type: runtime.shadow.differential
      min_count: 1
    - event_type: run.completed
      min_count: 1
  tool_calls: []
  runtime_path:
    runtime_contract_version: runtime-contracts.v16
    provider_lane: fixture
    attempt_owner: embedded_run_stream
    harness_id: embedded_run_stream
    context_engine_id: legacy_provider_input
    max_fallback_count: 0
    allowed_fallback_reason_codes: []
forbidden:
  tool_calls:
    - "*"
  events:
    - run.failed
    - approval.requested
    - runtime.shadow.provider_requested
    - runtime.shadow.tool_requested
    - runtime.shadow.delivery_requested
    - secret.exposed
  artifacts: []
  claims: []
artifacts:
  - path: qa/reports/runtime_kernel_v2/shadow_differential.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - deterministic
    - real_runtime
    - runtime_kernel_v2_shadow
    - promotion_gate
timeout:
  run_ms: 30000
  step_ms: 10000
