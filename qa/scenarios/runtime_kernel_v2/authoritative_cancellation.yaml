# Cancels an admitted authoritative V2 run before provider output can cross delivery.
schema_version: 5
id: runtime_kernel_v2.authoritative_cancellation
title: Authoritative RuntimeKernelV2 cancellation boundary
area: workflow
mode:
  runner: fixture
  deterministic: true
runner:
  provider_fixture: qa/fixtures/runtime_kernel_v2_authoritative.yaml
  workspace_fixture: qa/fixtures/sandbox_workspaces/repo_basic
  policy_profile: runtime_kernel_v2_authoritative_cancel
requires:
  model: text
  capabilities:
    - agent_run
    - qa_lab
    - cancellation
    - runtime_kernel_v2_authoritative
  tools: []
  fixtures:
    - qa/fixtures/runtime_kernel_v2_authoritative.yaml
    - qa/fixtures/sandbox_workspaces/repo_basic
steps:
  - id: prompt
    action: user_prompt
    prompt: "Wait for authoritative V2 cancellation."
expect:
  terminal_state: cancelled
  events:
    - event_type: runtime.authority.selected
      min_count: 1
    - event_type: status
      min_count: 1
    - event_type: run.cancelled
      min_count: 1
  tool_calls: []
  runtime_path:
    runtime_contract_version: runtime-contracts.v14
    provider_lane: fixture
    attempt_owner: runtime_kernel_v2.embedded
    harness_id: runtime_kernel_v2.embedded
    context_engine_id: runtime_kernel_v2.preassembled_context
    max_fallback_count: 0
    allowed_fallback_reason_codes: []
forbidden:
  tool_calls:
    - "*"
  events:
    - model.delta
    - message.replied
    - run.completed
    - runtime.shadow.differential
    - secret.exposed
  artifacts: []
  claims:
    - "This response must not cross the cancellation boundary."
artifacts:
  - path: qa/reports/runtime_kernel_v2/authoritative_cancellation.evidence.json
    kind: evidence
    required: true
maturity:
  labels:
    - p0
    - deterministic
    - real_runtime
    - runtime_kernel_v2_authoritative
    - promotion_gate
    - cancellation
timeout:
  run_ms: 30000
  step_ms: 10000
