# Preserved pre-runtime release coverage. This suite documents the legacy
# schema-preview baseline and is evaluated with one `palyra qa run-pack --tag
# p0` invocation for every scenario root below; its synthetic evidence must
# never count as real runtime qualification.
schema_version: 1
id: release_schema_preview_v1
mode: schema_preview
scenario_roots:
  - qa/scenarios
  - qa/scenarios/execution_backends
  - qa/scenarios/provider
  - qa/scenarios/mcp
include_tags:
  - p0
allow_provider_modes:
  - mock
require_p0_green: true
available_capabilities:
  - agent_run
  - qa_lab
  - approvals
  - context_compaction
  - delegation
  - execution_backend_parity
  - gateway_recovery
  - hook_policy
  - mcp
  - patch_verification
  - process_background
  - provider_compat
  - provider_recovery
  - provider_routing
  - provider_stream_normalizer
  - redaction
  - session_compaction
  - workspace_context
capability_skips:
  - capability: live_provider
    reason: "Schema preview uses recorded or mock P0 coverage and never live provider credentials."
flaky_policy:
  max_retries: 0
  fail_on_flaky: true
  require_issue: true
scorecard:
  baseline_score_bps: 0
  fail_on_required_blockers: false
  categories:
    - id: api
      label: API
      areas: [text]
      labels: [text_only]
    - id: mcp
      label: MCP
      labels: [mcp]
    - id: subagents
      label: Subagents
      labels: [delegation]
    - id: provider_recovery
      label: Provider recovery
      labels: [provider, provider_compat]
    - id: execution_backends
      label: Execution backends
      labels: [execution_backend_parity, process, mutating]
    - id: hooks
      label: Hooks
      labels: [security]
    - id: observability
      label: Observability
      labels: [workflow, gateway]
    - id: security
      label: Security
      labels: [security]
