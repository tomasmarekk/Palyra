schema_version: 1
# This scorecard is the first real-runtime release baseline. The preserved
# non-runtime predecessor lives in release_schema_preview.yaml and is exercised
# with `palyra qa run-pack`, never counted as runtime qualification.
id: release_runtime_v1
mode: release
scenario_roots:
  - qa/scenarios/real_runtime
include_tags:
  - p0
  - real_runtime
allow_provider_modes:
  - mock
allow_runner_modes:
  - fixture
require_p0_green: true
available_capabilities:
  - agent_run
  - qa_lab
  - approvals
  - provider_recovery
  - workspace_context
capability_skips: []
flaky_policy:
  max_retries: 0
  fail_on_flaky: true
  require_issue: true
scorecard:
  baseline_score_bps: 0
  fail_on_required_blockers: false
  categories:
    - id: api
      label: API
      areas: [text]
      labels: [text_only]
    - id: tools
      label: Tools
      areas: [tools]
      labels: [read_only]
    - id: approvals
      label: Approvals
      areas: [approvals]
      labels: [approval_denied]
    - id: provider_recovery
      label: Provider recovery
      areas: [provider]
      labels: [provider_recovery]
