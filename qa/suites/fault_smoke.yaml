schema_version: 2
id: deterministic_fault_smoke
mode: pr
scenario_roots:
  - qa/scenarios/fault_injection
include_tags:
  - fault_injection
allow_provider_modes:
  - mock
allow_runner_modes:
  - fixture
allow_live_providers: false
resume:
  enabled: false
  reuse_passed: false
  rerun_failed: true
  rerun_partial: true
require_p0_green: true
available_capabilities:
  - agent_run
  - qa_lab
  - approvals
  - workspace_context
  - fault_injection
capability_skips: []
flaky_policy:
  max_retries: 0
  fail_on_flaky: true
  require_issue: true
scorecard:
  baseline_score_bps: 0
  fail_on_required_blockers: true
  categories:
    - id: fault_recovery
      label: Fault recovery
      areas: [tools]
      labels: [fault_injection, crash_recovery]
