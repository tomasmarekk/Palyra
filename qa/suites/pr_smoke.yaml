schema_version: 2
id: pr_smoke
mode: pr
scenario_roots:
  - qa/scenarios/real_runtime
  - qa/scenarios/provider
include_tags:
  - release_smoke
  - real_runtime
allow_provider_modes:
  - mock
allow_runner_modes:
  - fixture
allow_live_providers: false
resume:
  enabled: true
  reuse_passed: true
  rerun_failed: true
  rerun_partial: true
require_p0_green: true
available_capabilities:
  - agent_run
  - qa_lab
  - approvals
  - provider_recovery
  - context_compaction
  - runtime_kernel_v2_authoritative
  - workspace_context
capability_skips: []
flaky_policy:
  max_retries: 0
  fail_on_flaky: true
  require_issue: true
scorecard:
  baseline_score_bps: 0
  fail_on_required_blockers: false
  categories:
    - id: api
      label: API
      areas: [text]
      labels: [text_only]
    - id: tools
      label: Tools
      areas: [tools]
      labels: [read_only]
    - id: approvals
      label: Approvals
      areas: [approvals]
      labels: [approval_denied]
    - id: provider_recovery
      label: Provider recovery
      areas: [provider]
      labels: [provider_recovery]
