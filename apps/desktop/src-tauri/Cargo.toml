[package]
name = "palyra-desktop-control-center"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
getrandom = "0.4.2"
palyra-common = { path = "../../../crates/palyra-common" }
palyra-control-plane = { path = "../../../crates/palyra-control-plane" }
palyra-vault = { path = "../../../crates/palyra-vault" }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "cookies", "native-tls"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1.50.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.1"
ulid = "1.2.0"
webbrowser = "1.0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2.184"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[patch.crates-io]
glib = { path = "third_party/glib-0.18.5-patched" }
phf_generator = { path = "third_party/phf-generator-0.8.0-patched" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
